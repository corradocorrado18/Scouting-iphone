<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Scouting 11v11</title><style>*{box-sizing:border-box;-webkit-user-select:none;user-select:none}body{margin:0;background:#111827;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}.app{max-width:600px;margin:auto;padding:12px}.title{font-size:20px;font-weight:800;margin:4px 0 10px}.legend{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px}.pitch{position:relative;width:100%;height:min(76vh,720px);min-height:520px;background:repeating-linear-gradient(0deg,#277b3f 0,#277b3f 10%,#2f8b49 10%,#2f8b49 20%);border:3px solid #fff;border-radius:14px;overflow:hidden;touch-action:none;-webkit-touch-callout:none}.line{position:absolute;pointer-events:none;border-color:#fff;border-style:solid;opacity:.95}.half{left:0;right:0;top:50%;border-width:2px 0 0}.circle{width:120px;height:120px;left:50%;top:50%;transform:translate(-50%,-50%);border-width:2px;border-radius:50%}.boxTop,.boxBottom{left:20%;width:60%;height:16%;border-width:2px}.boxTop{top:-2px}.boxBottom{bottom:-2px}.smallTop,.smallBottom{left:35%;width:30%;height:7%;border-width:2px}.smallTop{top:-2px}.smallBottom{bottom:-2px}.spot{position:absolute;width:6px;height:6px;background:#fff;border-radius:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none}.s1{top:11%}.s2{top:89%}.token{position:absolute;-webkit-user-drag:none;width:42px;height:42px;transform:translate(-50%,-50%);border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid white;box-shadow:0 2px 8px #0009;font-size:16px;font-weight:900;z-index:10;touch-action:none;-webkit-touch-callout:none}.blue{background:#1677ff}.red{background:#e33434}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}button{min-height:46px;border:0;border-radius:12px;font-size:15px;font-weight:800}.reset{background:#fff;color:#111827}.save{background:#22c55e;color:#062b14}.note{font-size:12px;color:#d1d5db;margin-top:9px;line-height:1.35}</style></head><body><div class="app"><div class="title">⚽ Scouting 11 vs 11</div><div class="legend"><span>🔵 Squadra A · 1–11</span><span>Squadra B · 1–11 🔴</span></div><div id="pitch" class="pitch"><div class="line half"></div><div class="line circle"></div><div class="line boxTop"></div><div class="line boxBottom"></div><div class="line smallTop"></div><div class="line smallBottom"></div><div class="spot s1"></div><div class="spot s2"></div>
<div class="token blue" data-id="a1" style="left:50%;top:94%">1</div><div class="token blue" data-id="a2" style="left:15%;top:83%">2</div><div class="token blue" data-id="a3" style="left:38%;top:83%">3</div><div class="token blue" data-id="a4" style="left:62%;top:83%">4</div><div class="token blue" data-id="a5" style="left:85%;top:83%">5</div><div class="token blue" data-id="a6" style="left:28%;top:68%">6</div><div class="token blue" data-id="a7" style="left:50%;top:69%">7</div><div class="token blue" data-id="a8" style="left:72%;top:68%">8</div><div class="token blue" data-id="a9" style="left:18%;top:56%">9</div><div class="token blue" data-id="a10" style="left:50%;top:56%">10</div><div class="token blue" data-id="a11" style="left:82%;top:56%">11</div>
<div class="token red" data-id="b1" style="left:50%;top:6%">1</div><div class="token red" data-id="b2" style="left:15%;top:17%">2</div><div class="token red" data-id="b3" style="left:38%;top:17%">3</div><div class="token red" data-id="b4" style="left:62%;top:17%">4</div><div class="token red" data-id="b5" style="left:85%;top:17%">5</div><div class="token red" data-id="b6" style="left:28%;top:32%">6</div><div class="token red" data-id="b7" style="left:50%;top:31%">7</div><div class="token red" data-id="b8" style="left:72%;top:32%">8</div><div class="token red" data-id="b9" style="left:18%;top:44%">9</div><div class="token red" data-id="b10" style="left:50%;top:44%">10</div><div class="token red" data-id="b11" style="left:82%;top:44%">11</div></div><div class="buttons"><button class="reset" id="reset">Reset</button><button class="save" id="save">Salva posizioni</button></div><div class="note">Le 22 pedine sono già presenti nell'HTML, quindi sono visibili anche se Safari limita parte dello script. Per spostarle, trascinale direttamente con il dito.</div></div><script>(function(){
var pitch=document.getElementById('pitch');
var tokens=Array.prototype.slice.call(document.querySelectorAll('.token'));
var active=null,dx=0,dy=0;
var initial={};
tokens.forEach(function(t){initial[t.dataset.id]={l:t.style.left,tp:t.style.top};});
try{var saved=JSON.parse(localStorage.getItem('scoutingSafariPositions')||'{}');tokens.forEach(function(t){if(saved[t.dataset.id]){t.style.left=saved[t.dataset.id].l;t.style.top=saved[t.dataset.id].tp;}});}catch(e){}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function start(clientX,clientY,t){active=t;var r=t.getBoundingClientRect();dx=clientX-(r.left+r.width/2);dy=clientY-(r.top+r.height/2);t.style.zIndex='30';}
function move(clientX,clientY){if(!active)return;var r=pitch.getBoundingClientRect();var x=(clientX-dx-r.left)/r.width*100;var y=(clientY-dy-r.top)/r.height*100;active.style.left=clamp(x,6,94)+'%';active.style.top=clamp(y,4,96)+'%';}
function end(){if(active){active.style.zIndex='10';active=null;}}
tokens.forEach(function(t){
 t.addEventListener('touchstart',function(e){if(e.touches.length!==1)return;e.preventDefault();var q=e.touches[0];start(q.clientX,q.clientY,t);},{passive:false});
 t.addEventListener('mousedown',function(e){e.preventDefault();start(e.clientX,e.clientY,t);});
});
document.addEventListener('touchmove',function(e){if(!active||e.touches.length!==1)return;e.preventDefault();var q=e.touches[0];move(q.clientX,q.clientY);},{passive:false});
document.addEventListener('touchend',function(e){if(active){e.preventDefault();end();}},{passive:false});
document.addEventListener('touchcancel',end,{passive:false});
document.addEventListener('mousemove',function(e){if(active){e.preventDefault();move(e.clientX,e.clientY);}});
document.addEventListener('mouseup',end);
document.getElementById('save').onclick=function(){var o={};tokens.forEach(function(t){o[t.dataset.id]={l:t.style.left,tp:t.style.top};});try{localStorage.setItem('scoutingSafariPositions',JSON.stringify(o));alert('Posizioni salvate');}catch(e){alert('Posizioni mantenute finché la pagina resta aperta');}};
document.getElementById('reset').onclick=function(){tokens.forEach(function(t){t.style.left=initial[t.dataset.id].l;t.style.top=initial[t.dataset.id].tp;});try{localStorage.removeItem('scoutingSafariPositions');}catch(e){}};
})();</script></body></html>
