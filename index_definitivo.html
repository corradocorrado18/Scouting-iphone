<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Scouting"><link rel="manifest" href="manifest.webmanifest"><title>Scouting 11v11</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111827;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}.app{max-width:620px;margin:auto;padding:12px;padding-top:max(12px,env(safe-area-inset-top));padding-bottom:max(12px,env(safe-area-inset-bottom))}.title{font-size:20px;font-weight:900;margin:4px 0 10px}.teams{display:grid;grid-template-columns:1fr 88px 1fr;gap:8px;margin-bottom:8px}button{min-height:44px;border:0;border-radius:11px;font:inherit;font-weight:800;touch-action:manipulation}.team{padding:8px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.teamA{background:#1677ff}.teamB{background:#e33434}.score{background:#fff;color:#111;font-size:17px}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}.toolbar button:nth-child(1){background:#374151;color:#fff}.toolbar button:nth-child(2){background:#0f766e;color:#fff}.toolbar button:nth-child(3){background:#2563eb;color:#fff}.toolbar button:nth-child(4){background:#7c3aed;color:#fff}.pitch{position:relative;width:100%;height:min(70vh,700px);min-height:500px;background:repeating-linear-gradient(0deg,#277b3f 0,#277b3f 10%,#2f8b49 10%,#2f8b49 20%);border:3px solid #fff;border-radius:14px;overflow:hidden;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}.line{position:absolute;pointer-events:none;border-color:#fff;border-style:solid;opacity:.95}.half{left:0;right:0;top:50%;border-width:2px 0 0}.circle{width:120px;height:120px;left:50%;top:50%;transform:translate(-50%,-50%);border-width:2px;border-radius:50%}.boxTop,.boxBottom{left:20%;width:60%;height:16%;border-width:2px}.boxTop{top:-2px}.boxBottom{bottom:-2px}.smallTop,.smallBottom{left:35%;width:30%;height:7%;border-width:2px}.smallTop{top:-2px}.smallBottom{bottom:-2px}.token{position:absolute;width:42px;height:42px;transform:translate(-50%,-50%);border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 2px 8px #0009;font-size:16px;font-weight:900;z-index:10;touch-action:none}.blue{background:#1677ff}.red{background:#e33434}.token.saved{box-shadow:0 0 0 3px #fff,0 0 0 6px #1118}.surnameTag{position:absolute;transform:translate(-50%,0);z-index:9;background:#000d;color:#fff;font-size:10px;font-weight:900;padding:2px 5px;border-radius:5px;white-space:nowrap;pointer-events:none}.pitchButtons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.pitchButtons button:first-child{background:#fff;color:#111}.pitchButtons button:last-child{background:#22c55e;color:#062b14}.note{font-size:12px;color:#d1d5db;line-height:1.4;margin-top:8px}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:100;padding:14px;align-items:center;justify-content:center}.modal.open{display:flex}.sheet{width:min(100%,540px);max-height:90vh;overflow:auto;background:#fff;color:#111;border-radius:18px;padding:16px;-webkit-overflow-scrolling:touch}.sheet h2{margin:0 0 12px}.form{display:grid;grid-template-columns:1fr 1fr;gap:9px}.form label{font-size:12px;font-weight:800}.form input,.form select,.form textarea{display:block;width:100%;margin-top:4px;padding:11px;border:1px solid #d1d5db;border-radius:10px;font:inherit;-webkit-user-select:text;user-select:text}.wide{grid-column:1/-1}.modalButtons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.primary{background:#22c55e;color:#062b14}.secondary{background:#e5e7eb;color:#111}.danger{background:#fee2e2;color:#991b1b}.colorGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.colorGrid button{min-height:60px}.listRow{display:grid;grid-template-columns:16px 42px 1fr auto;gap:7px;align-items:center;padding:9px 0;border-top:1px solid #e5e7eb}.dot{width:14px;height:14px;border-radius:50%}@media(max-width:430px){.form{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body><main class="app"><div class="title">⚽ Scouting 11 vs 11</div><div class="teams"><button id="teamA" class="team teamA">Squadra A ✎</button><button id="resultBtn" class="team score">0 - 0</button><button id="teamB" class="team teamB">Squadra B ✎</button></div><div class="toolbar"><button id="changesBtn">CAMBI</button><button id="summaryBtn">RIEPILOGO</button><button id="saveMatchBtn">SALVA PARTITA</button><button id="archiveBtn">ARCHIVIO / BACKUP</button></div><input id="importFile" type="file" accept="application/json,.json" hidden><div id="pitch" class="pitch"><div class="line half"></div><div class="line circle"></div><div class="line boxTop"></div><div class="line boxBottom"></div><div class="line smallTop"></div><div class="line smallBottom"></div></div><div class="pitchButtons"><button id="resetBtn">Reset campo</button><button id="savePositionsBtn">Salva posizioni</button></div><div class="note">1 tocco: cognome · 2 tocchi: scheda · trascina: sposta · tieni premuto 2 secondi: colore</div></main>

<div id="playerModal" class="modal"><div class="sheet"><h2 id="playerTitle">Scheda giocatore</h2><div class="form"><label>Cognome<input id="pSurname"></label><label>Altezza<input id="pHeight" placeholder="es. 178 cm"></label><label>Piede<select id="pFoot"><option value=""></option><option>Destro</option><option>Sinistro</option><option>Ambidestro</option></select></label><label>Velocità<select id="pSpeed"></select></label><label>Forza<select id="pStrength"></select></label><label>1° controllo<select id="pControl"></select></label><label>Tecnica<select id="pTechnique"></select></label><label>Tattica<select id="pTactics"></select></label><label>Leadership<select id="pLeadership"></select></label><label>Tiro<select id="pShot"></select></label><label>Lancio<select id="pLongPass"></select></label><label>Colpo di testa<select id="pHeading"></select></label><label>Ruolo<input id="pRole"></label><label class="wide">Note<textarea id="pNotes" rows="4"></textarea></label></div><div class="modalButtons"><button id="savePlayer" class="primary">Salva scheda</button><button data-close="playerModal" class="secondary">Chiudi</button></div></div></div>
<div id="colorModal" class="modal"><div class="sheet"><h2>Colore pedina</h2><div class="colorGrid"><button class="colorPick" data-color="#22c55e" style="background:#22c55e">Verde</button><button class="colorPick" data-color="#f97316" style="background:#f97316;color:#fff">Arancione</button><button class="colorPick" data-color="#f5c518" style="background:#f5c518">Giallo</button></div><div class="modalButtons"><button data-close="colorModal" class="secondary wide">Annulla</button></div></div></div>
<div id="changesModal" class="modal"><div class="sheet"><h2>Cambi</h2><div class="form"><label>Squadra<select id="cTeam"><option value="A">Squadra A</option><option value="B">Squadra B</option></select></label><label>Numero<input id="cNumber" inputmode="numeric"></label><label>Cognome<input id="cSurname"></label><label>Ruolo<input id="cRole"></label><label>Min. entrata<input id="cMinute" inputmode="numeric"></label><label>Valore<select id="cValue"><option value=""></option><option value="green">Verde</option><option value="orange">Arancione</option><option value="yellow">Giallo</option></select></label><label class="wide">Note<textarea id="cNotes" rows="3"></textarea></label></div><div class="modalButtons"><button id="saveChange" class="primary">Salva cambio</button><button data-close="changesModal" class="secondary">Chiudi</button></div><div id="changesList"></div></div></div>
<div id="resultModal" class="modal"><div class="sheet"><h2>Risultato e marcatori</h2><div id="scoreBox" style="text-align:center;font-size:34px;font-weight:900;margin:8px">0 - 0</div><div class="form"><label>Squadra<select id="gTeam"><option value="A">Squadra A</option><option value="B">Squadra B</option></select></label><label>Minuto<input id="gMinute" inputmode="numeric"></label><label class="wide">Marcatore<input id="gScorer"></label></div><div class="modalButtons"><button id="addGoal" class="primary">Aggiungi gol</button><button data-close="resultModal" class="secondary">Chiudi</button></div><div id="goalsList"></div></div></div>
<div id="summaryModal" class="modal"><div class="sheet"><h2>Riepilogo fine partita</h2><div id="summaryCounters"></div><div id="summaryPlayers"></div><div class="modalButtons"><button data-close="summaryModal" class="secondary wide">Chiudi</button></div></div></div>
<div id="archiveModal" class="modal"><div class="sheet"><h2>Archivio e backup</h2><div id="archiveList"></div><div class="modalButtons"><button id="exportAll" style="background:#2563eb;color:#fff">Esporta tutto</button><button id="importAll" style="background:#059669;color:#fff">Importa backup</button><button id="newMatch" style="background:#f59e0b">Nuova partita</button><button data-close="archiveModal" class="secondary">Chiudi</button></div></div></div>
<script>
(function(){'use strict';
const $=id=>document.getElementById(id), pitch=$('pitch');
const ratings=['pSpeed','pStrength','pControl','pTechnique','pTactics','pLeadership','pShot','pLongPass','pHeading'];ratings.forEach(id=>$(id).innerHTML='<option value=""></option>'+[1,2,3,4,5].map(n=>'<option>'+n+'</option>').join(''));
const startA=[[50,94],[15,83],[38,83],[62,83],[85,83],[28,68],[50,69],[72,68],[18,56],[50,56],[82,56]],startB=startA.map(p=>[p[0],100-p[1]]);
let positions=load('scoutingSafariPositions',{}),cards=load('scoutingPlayerCards',{}),colors=load('scoutingTokenColors',{}),changes=load('scoutingChanges',[]),goals=load('scoutingGoals',[]),selected=null,colorTarget=null;
function load(k,f){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(f))}catch(e){return f}}function save(k,v){localStorage.setItem(k,JSON.stringify(v))}function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function buildTokens(){[...startA.map((p,i)=>({id:'a'+(i+1),n:i+1,p,team:'blue'})),...startB.map((p,i)=>({id:'b'+(i+1),n:i+1,p,team:'red'}))].forEach(o=>{let t=document.createElement('div'),pos=positions[o.id]||{x:o.p[0],y:o.p[1]};t.className='token '+o.team;t.dataset.id=o.id;t.textContent=o.n;t.style.left=pos.x+'%';t.style.top=pos.y+'%';if(colors[o.id])t.style.background=colors[o.id];pitch.appendChild(t);bindToken(t)});renderTags()}
function renderTags(){pitch.querySelectorAll('.surnameTag').forEach(x=>x.remove());pitch.querySelectorAll('.token').forEach(t=>{let c=cards[t.dataset.id];t.classList.toggle('saved',!!c);if(c&&c.surname){let tag=document.createElement('div');tag.className='surnameTag';tag.dataset.for=t.dataset.id;tag.textContent=c.surname;tag.style.left=t.style.left;tag.style.top='calc('+t.style.top+' + 23px)';pitch.appendChild(tag)}})}function moveTag(t){let tag=pitch.querySelector('.surnameTag[data-for="'+t.dataset.id+'"]');if(tag){tag.style.left=t.style.left;tag.style.top='calc('+t.style.top+' + 23px)'}}
let tapTimer=null,lastTapId='',lastTapAt=0;function bindToken(t){let down=false,moved=false,longFired=false,longTimer=null,sx=0,sy=0,dx=0,dy=0;
t.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;e.preventDefault();down=true;moved=false;longFired=false;sx=e.clientX;sy=e.clientY;let r=t.getBoundingClientRect();dx=e.clientX-(r.left+r.width/2);dy=e.clientY-(r.top+r.height/2);t.setPointerCapture(e.pointerId);longTimer=setTimeout(()=>{if(down&&!moved){longFired=true;down=false;colorTarget=t;openModal('colorModal');try{t.releasePointerCapture(e.pointerId)}catch(_){}}},2000)});
t.addEventListener('pointermove',e=>{if(!down)return;let dist=Math.hypot(e.clientX-sx,e.clientY-sy);if(dist>8){moved=true;clearTimeout(longTimer)}if(moved){e.preventDefault();let r=pitch.getBoundingClientRect(),x=Math.max(6,Math.min(94,(e.clientX-dx-r.left)/r.width*100)),y=Math.max(4,Math.min(96,(e.clientY-dy-r.top)/r.height*100));t.style.left=x+'%';t.style.top=y+'%';positions[t.dataset.id]={x,y};moveTag(t)}});
function finish(e){clearTimeout(longTimer);if(!down){longFired=false;return}down=false;try{t.releasePointerCapture(e.pointerId)}catch(_){}if(moved){save('scoutingSafariPositions',positions);return}if(longFired)return;let now=Date.now();if(lastTapId===t.dataset.id&&now-lastTapAt<430){clearTimeout(tapTimer);tapTimer=null;lastTapId='';lastTapAt=0;openPlayer(t)}else{lastTapId=t.dataset.id;lastTapAt=now;clearTimeout(tapTimer);tapTimer=setTimeout(()=>{quickSurname(t);lastTapId='';lastTapAt=0},450)}}t.addEventListener('pointerup',finish);t.addEventListener('pointercancel',()=>{clearTimeout(longTimer);down=false})}
function openModal(id){$(id).classList.add('open')}function closeModal(id){$(id).classList.remove('open')}document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();closeModal(b.dataset.close)}));document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)closeModal(m.id)}));
function quickSurname(t){let c=cards[t.dataset.id]||{},n=prompt('Cognome giocatore',c.surname||'');if(n!==null){c.surname=n.trim();cards[t.dataset.id]=c;save('scoutingPlayerCards',cards);renderTags()}}function openPlayer(t){selected=t;let c=cards[t.dataset.id]||{};$('playerTitle').textContent='Scheda giocatore '+t.textContent;['Surname','Height','Foot','Speed','Strength','Control','Technique','Tactics','Leadership','Shot','LongPass','Heading','Role','Notes'].forEach(k=>$('p'+k).value=c[k.charAt(0).toLowerCase()+k.slice(1)]||'');openModal('playerModal')}
$('savePlayer').onclick=()=>{if(!selected)return;let c={};['Surname','Height','Foot','Speed','Strength','Control','Technique','Tactics','Leadership','Shot','LongPass','Heading','Role','Notes'].forEach(k=>c[k.charAt(0).toLowerCase()+k.slice(1)]=$('p'+k).value.trim());cards[selected.dataset.id]=c;save('scoutingPlayerCards',cards);renderTags();closeModal('playerModal')};
document.querySelectorAll('.colorPick').forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();if(colorTarget){colorTarget.style.background=b.dataset.color;colors[colorTarget.dataset.id]=b.dataset.color;save('scoutingTokenColors',colors)}colorTarget=null;closeModal('colorModal')});
function setTeamLabels(){let a=localStorage.getItem('scoutingTeamA')||'Squadra A',b=localStorage.getItem('scoutingTeamB')||'Squadra B';$('teamA').textContent=a+' ✎';$('teamB').textContent=b+' ✎';$('cTeam').options[0].text=a;$('cTeam').options[1].text=b;$('gTeam').options[0].text=a;$('gTeam').options[1].text=b}function rename(k,d){let n=prompt('Nome squadra',localStorage.getItem(k)||d);if(n&&n.trim()){localStorage.setItem(k,n.trim());setTeamLabels();renderScore()}}$('teamA').onclick=()=>rename('scoutingTeamA','Squadra A');$('teamB').onclick=()=>rename('scoutingTeamB','Squadra B');
function teamName(k){return localStorage.getItem(k==='A'?'scoutingTeamA':'scoutingTeamB')||(k==='A'?'Squadra A':'Squadra B')}function renderScore(){let a=goals.filter(g=>g.team==='A').length,b=goals.filter(g=>g.team==='B').length;$('resultBtn').textContent=a+' - '+b;$('scoreBox').textContent=a+' - '+b;$('goalsList').innerHTML=goals.map((g,i)=>'<div class="listRow"><span></span><b>'+esc(g.minute)+'′</b><span><b>'+esc(teamName(g.team))+'</b> · '+esc(g.scorer)+'</span><button class="danger" data-delgoal="'+i+'">Elimina</button></div>').join('')||'<p>Nessun gol.</p>';$('goalsList').querySelectorAll('[data-delgoal]').forEach(b=>b.onclick=()=>{goals.splice(+b.dataset.delgoal,1);save('scoutingGoals',goals);renderScore()})}$('resultBtn').onclick=()=>{renderScore();openModal('resultModal')};$('addGoal').onclick=()=>{let s=$('gScorer').value.trim();if(!s)return alert('Inserisci il marcatore');goals.push({team:$('gTeam').value,scorer:s,minute:$('gMinute').value.trim()});save('scoutingGoals',goals);$('gScorer').value='';$('gMinute').value='';renderScore()};
function vColor(v){return v==='green'?'#22c55e':v==='orange'?'#f97316':v==='yellow'?'#f5c518':'#ddd'}function renderChanges(){$('changesList').innerHTML=changes.map((c,i)=>'<div class="listRow"><i class="dot" style="background:'+vColor(c.value)+'"></i><b>#'+esc(c.number)+'</b><span><b>'+esc(c.surname)+'</b> · '+esc(c.role)+' · '+esc(teamName(c.team))+' · '+esc(c.minute)+'′<br><small>'+esc(c.notes)+'</small></span><button class="danger" data-delchange="'+i+'">Elimina</button></div>').join('')||'<p>Nessun cambio.</p>';$('changesList').querySelectorAll('[data-delchange]').forEach(b=>b.onclick=()=>{changes.splice(+b.dataset.delchange,1);save('scoutingChanges',changes);renderChanges()})}$('changesBtn').onclick=()=>{renderChanges();openModal('changesModal')};$('saveChange').onclick=()=>{let c={team:$('cTeam').value,number:$('cNumber').value.trim(),surname:$('cSurname').value.trim(),role:$('cRole').value.trim(),minute:$('cMinute').value.trim(),value:$('cValue').value,notes:$('cNotes').value.trim()};if(!c.number||!c.surname)return alert('Inserisci numero e cognome');changes.push(c);save('scoutingChanges',changes);['cNumber','cSurname','cRole','cMinute','cNotes'].forEach(id=>$(id).value='');$('cValue').value='';renderChanges()};
function colorKey(v){v=(v||'').toLowerCase();if(v.includes('34, 197, 94')||v==='#22c55e')return'green';if(v.includes('249, 115, 22')||v==='#f97316')return'orange';if(v.includes('245, 197, 24')||v==='#f5c518')return'yellow';return''}function renderSummary(){let rows=[];pitch.querySelectorAll('.token').forEach(t=>{let col=colorKey(t.style.background),c=cards[t.dataset.id]||{};if(col)rows.push({color:col,n:t.textContent,name:c.surname||'Senza cognome',team:t.dataset.id[0]==='a'?'A':'B',kind:'Titolare'})});changes.forEach(c=>{if(c.value)rows.push({color:c.value,n:c.number,name:c.surname,team:c.team,kind:'Cambio '+c.minute+'′'})});let counts={green:0,orange:0,yellow:0};rows.forEach(r=>counts[r.color]++);$('summaryCounters').innerHTML='<div class="colorGrid"><div style="background:#dcfce7;padding:10px;text-align:center;border-radius:10px"><b>'+counts.green+'</b><br>Verdi</div><div style="background:#ffedd5;padding:10px;text-align:center;border-radius:10px"><b>'+counts.orange+'</b><br>Arancioni</div><div style="background:#fef9c3;padding:10px;text-align:center;border-radius:10px"><b>'+counts.yellow+'</b><br>Gialli</div></div>';$('summaryPlayers').innerHTML=rows.map(r=>'<div class="listRow"><i class="dot" style="background:'+vColor(r.color)+'"></i><b>#'+esc(r.n)+'</b><span><b>'+esc(r.name)+'</b><br><small>'+esc(teamName(r.team))+' · '+esc(r.kind)+'</small></span></div>').join('')||'<p>Nessun giocatore colorato.</p>'}$('summaryBtn').onclick=()=>{renderSummary();openModal('summaryModal')};
$('savePositionsBtn').onclick=()=>{pitch.querySelectorAll('.token').forEach(t=>{positions[t.dataset.id]={x:parseFloat(t.style.left),y:parseFloat(t.style.top)}});save('scoutingSafariPositions',positions);alert('Posizioni salvate')};$('resetBtn').onclick=()=>{positions={};save('scoutingSafariPositions',positions);location.reload()};
const DATA_KEYS=['scoutingTeamA','scoutingTeamB','scoutingSafariPositions','scoutingTokenColors','scoutingPlayerCards','scoutingChanges','scoutingGoals'];function snapshot(){let data={};DATA_KEYS.forEach(k=>data[k]=localStorage.getItem(k));return{id:'m'+Date.now(),savedAt:new Date().toISOString(),teamA:teamName('A'),teamB:teamName('B'),scoreA:goals.filter(g=>g.team==='A').length,scoreB:goals.filter(g=>g.team==='B').length,data}}function download(obj,name){let u=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}function restore(m){DATA_KEYS.forEach(k=>m.data[k]==null?localStorage.removeItem(k):localStorage.setItem(k,m.data[k]));location.reload()}function archive(){return load('scoutingMatchArchive',[])}$('saveMatchBtn').onclick=()=>{let m=snapshot(),a=archive();a.unshift(m);save('scoutingMatchArchive',a);download({format:'ScoutingPWA-Backup',version:11,matches:a,current:m},m.savedAt.slice(0,10)+'_'+m.teamA.replace(/\W+/g,'_')+'-'+m.teamB.replace(/\W+/g,'_')+'.json');alert('Partita archiviata. Salva il file in iCloud Drive o OneDrive.')};function renderArchive(){let a=archive();$('archiveList').innerHTML=a.map((m,i)=>'<div class="listRow"><span></span><span></span><span><b>'+esc(m.teamA)+' '+m.scoreA+' - '+m.scoreB+' '+esc(m.teamB)+'</b><br><small>'+new Date(m.savedAt).toLocaleString('it-IT')+'</small></span><button data-openmatch="'+i+'">Apri</button></div>').join('')||'<p>Nessuna partita.</p>';$('archiveList').querySelectorAll('[data-openmatch]').forEach(b=>b.onclick=()=>{if(confirm('Aprire questa partita?'))restore(a[+b.dataset.openmatch])})}$('archiveBtn').onclick=()=>{renderArchive();openModal('archiveModal')};$('exportAll').onclick=()=>download({format:'ScoutingPWA-Backup',version:11,matches:archive(),current:snapshot()},'scouting_backup_'+new Date().toISOString().slice(0,10)+'.json');$('importAll').onclick=()=>$('importFile').click();$('importFile').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let b=JSON.parse(r.result);if(b.format!=='ScoutingPWA-Backup')throw Error();save('scoutingMatchArchive',b.matches||[]);restore(b.current)}catch(_){alert('Backup non valido')}};r.readAsText(f)};$('newMatch').onclick=()=>{if(confirm('Creare una nuova partita? Salva prima quella corrente.')){DATA_KEYS.forEach(k=>localStorage.removeItem(k));location.reload()}};
setTeamLabels();buildTokens();renderScore();renderChanges();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});
})();
</script></body></html>
